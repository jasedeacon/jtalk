name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 16 * * 3'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
      - run: dotnet restore jtalk.slnx --locked-mode --nologo
      - run: dotnet build jtalk.slnx -c Release --no-restore --nologo
      - uses: github/codeql-action/analyze@v4
