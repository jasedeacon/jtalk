name: Bug report
description: Report reproducible incorrect behavior
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, sensitive hook payloads, or unreviewed logs.
  - type: input
    id: version
    attributes:
      label: JTalk version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: TTS engine
      options: [windows, piper, openai, not applicable]
  - type: textarea
    id: environment
    attributes:
      label: Windows, Claude Code, and Codex versions
